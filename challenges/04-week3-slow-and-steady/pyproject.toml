[project]
name = "skunkworks-sloth"
version = "0.1.0"
description = "Three local-first agents that turn a hoarded reading list into prototypes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "openai>=3.37.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "stagehand>=4.3.0",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
]

[project.scripts]
sloth = "sloth.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sloth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
