name: sloth-worker
version: 0.1.0
description: "Skunkworks Sloth Worker desk: starts the two-hour prototype box (`sloth work`) and pushes a repo only on `approve`. Codes with open-weight google/gemma-4-26b-a4b-it on OpenRouter."
hermes_requires: ">=0.22.0"
author: "Santiago Gonzalez"
license: "MIT"
# scripts/ carries the cron scripts; Hermes copies it only because it is listed here.
distribution_owned:
  - SOUL.md
  - config.yaml
  - skills/
  - cron/jobs.json
  - scripts/
env_requires:
  - name: DISCORD_BOT_TOKEN
    description: "This agent's own Discord bot token (one bot per agent)"
    required: true
  - name: DISCORD_ALLOWED_USERS
    description: "Your Discord user id; only you can talk to the bot"
    required: true
  - name: DISCORD_ALLOWED_CHANNELS
    description: "Channel ids this agent listens in (#sk-worker), comma-separated"
    required: true
  - name: DISCORD_FREE_RESPONSE_CHANNELS
    description: "Channel ids where it answers without an @mention (same as above)"
    required: true
  - name: DISCORD_HOME_CHANNEL
    description: "The agent's home channel id"
    required: true
  - name: DISCORD_ALLOW_BOTS
    description: "Never answer other bots (the three Sloth bots share a server)"
    required: false
    default: "none"
  - name: SLOTH_DRY_RUN
    description: "0 = really post to Discord; 1 = print instead"
    required: false
    default: "0"
  - name: OPENROUTER_API_KEY
    description: "OpenRouter key for the Worker's open-weight model (hosted, paid per run)"
    required: true
  - name: ANTHROPIC_API_KEY
    description: "Only for closed-model plumbing test runs (llm.worker_provider = anthropic); leave unset otherwise"
    required: false
    default: ""
