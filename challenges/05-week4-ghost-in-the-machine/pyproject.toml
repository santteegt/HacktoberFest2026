[project]
name = "eth-ghosts"
version = "0.1.0"
description = "A ghosts in the decentralized world computer: stories of old Ethereum contracts, told by a local open-weight model from code-verified facts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "playwright>=1.64.1",
  "typer>=0.12",
]

[project.scripts]
ghosts = "ghosts.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghosts"]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8",
]
