<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gemma on-device spike</title>
  </head>
  <body>
    <h1>Gemma 4 E2B on-device spike</h1>
    <p class="muted">Throwaway test page. Run the steps in order. Do step 5 with Wi-Fi/data OFF.</p>
    <div class="steps">
      <button id="b1">1. Check device</button>
      <button id="b2">2. Download model (2 GB, Wi-Fi)</button>
      <button id="b3">3. Init runtime (needs this page's server)</button>
      <button id="b4">4. Create engine from cache</button>
      <button id="b5">5. Run 10 test utterances</button>
      <button id="b6">6. Show report</button>
    </div>
    <progress id="bar" value="0" max="1" hidden></progress>
    <pre id="log"></pre>
    <textarea id="report" rows="14" readonly placeholder="Report appears here. Select all, copy, paste back to Claude."></textarea>
    <script type="module" src="/src/spike/main.ts"></script>
  </body>
</html>
