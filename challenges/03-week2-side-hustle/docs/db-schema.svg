<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="1280" height="840" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>PartsPaddock data model</title><desc>Seven tables. clubs (name, city, country, WhatsApp group id) have members (phone, name, class, brands). listings belong to a club and a member: kind HAVE or NEED, brand, chassis, normalized part number, description, condition, price, quantity, status open, matched or closed, and a full-text search column. matches link a NEED listing and a HAVE listing with a method (part number or text) and a score. quotes belong to a member, optionally to a listing and to an order: store code and URL, price, weight, fee, processing, totals, with_processing, status and tracking number. deposits belong to a quote and a member: the PDF copy, expected and read amount, reference, checks and a status. orders group quote ids per store with a summary. Quote status goes quoted, awaiting_deposit, deposit_submitted, paid, ordered when we order it, or quoted, awaiting_tracking, in_transit, ordered for a self-order.</desc><defs><marker id="many" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,6 H11 M1,1 L10,6 M1,11 L10,6" fill="none" stroke="#64748B" stroke-width="1.5"/></marker><marker id="one" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M7,1 V11 M1,6 H11" fill="none" stroke="#64748B" stroke-width="1.5"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect width="1280" height="840" fill="#FFFFFF"/><text x="30" y="50" font-size="26" font-weight="800" fill="#0F2A3D">PartsPaddock data model</text><text x="30" y="76" font-size="14" fill="#4B5563">Postgres 18 on Tiger Cloud. Every write goes through the rcparts CLI; the agent can only read (MCP db_query).</text><rect x="30" y="110" width="260" height="152" rx="12" fill="#FFFFFF" stroke="#007A59" stroke-width="2"/><path d="M30,122 a12,12 0 0 1 12,-12 h236 a12,12 0 0 1 12,12 v22 h-260 z" fill="#007A59"/><text x="44" y="133" font-size="15" font-weight="800" fill="#FFFFFF">clubs</text><text x="44" y="160" font-size="13" font-weight="700" fill="#0F2A3D">id</text><text x="278" y="160" font-size="11" font-weight="700" text-anchor="end" fill="#007A59">PK</text><rect x="32" y="167" width="256" height="22" fill="#F4F7FA"/><text x="44" y="182" font-size="13" font-weight="400" fill="#0F2A3D">name</text><text x="44" y="204" font-size="13" font-weight="400" fill="#0F2A3D">city</text><rect x="32" y="211" width="256" height="22" fill="#F4F7FA"/><text x="44" y="226" font-size="13" font-weight="400" fill="#0F2A3D">country</text><text x="44" y="248" font-size="13" font-weight="400" fill="#0F2A3D">whatsapp_group_jid</text><rect x="30" y="330" width="260" height="174" rx="12" fill="#FFFFFF" stroke="#007A59" stroke-width="2"/><path d="M30,342 a12,12 0 0 1 12,-12 h236 a12,12 0 0 1 12,12 v22 h-260 z" fill="#007A59"/><text x="44" y="353" font-size="15" font-weight="800" fill="#FFFFFF">members</text><text x="44" y="380" font-size="13" font-weight="700" fill="#0F2A3D">id</text><text x="278" y="380" font-size="11" font-weight="700" text-anchor="end" fill="#007A59">PK</text><rect x="32" y="387" width="256" height="22" fill="#F4F7FA"/><text x="44" y="402" font-size="13" font-weight="700" fill="#0F2A3D">club_id</text><text x="278" y="402" font-size="11" font-weight="700" text-anchor="end" fill="#007A59">FK</text><text x="44" y="424" font-size="13" font-weight="400" fill="#0F2A3D">phone</text><text x="278" y="424" font-size="11.5" font-weight="400" text-anchor="end" fill="#4B5563">unique</text><rect x="32" y="431" width="256" height="22" fill="#F4F7FA"/><text x="44" y="446" font-size="13" font-weight="400" fill="#0F2A3D">display_name</text><text x="44" y="468" font-size="13" font-weight="400" fill="#0F2A3D">rc_class<