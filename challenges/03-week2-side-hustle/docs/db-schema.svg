="336" font-size="13" font-weight="400" fill="#0F2A3D">status</text><text x="588" y="336" font-size="11.5" font-weight="400" text-anchor="end" fill="#4B5563">open·matched·closed</text><rect x="342" y="343" width="256" height="22" fill="#F4F7FA"/><text x="354" y="358" font-size="13" font-weight="400" fill="#0F2A3D">closed_reason</text><text x="354" y="380" font-size="13" font-weight="400" fill="#0F2A3D">search</text><text x="588" y="380" font-size="11.5" font-weight="400" text-anchor="end" fill="#4B5563">tsvector</text><rect x="340" y="480" width="260" height="174" rx="12" fill="#FFFFFF" stroke="#0B5C8E" stroke-width="2"/><path d="M340,492 a12,12 0 0 1 12,-12 h236 a12,12 0 0 1 12,12 v22 h-260 z" fill="#0B5C8E"/><text x="354" y="503" font-size="15" font-weight="800" fill="#FFFFFF">matches</text><text x="354" y="530" font-size="13" font-weight="700" fill="#0F2A3D">id</text><text x="588" y="530" font-size="11" font-weight="700" text-anchor="end" fill="#0B5C8E">PK</text><rect x="342" y="537" width="256" height="22" fill="#F4F7FA"/><text x="354" y="552" font-size="13" font-weight="700" fill="#0F2A3D">need_id</text><text x="588" y="552" font-size="11" font-weight="700" text-anchor="end" fill="#0B5C8E">FK</text><text x="354" y="574" font-size="13" font-weight="700" fill="#0F2A3D">have_id</text><text x="588" y="574" font-size="11" font-weight="700" text-anchor="end" fill="#0B5C8E">FK</text><rect x="342" y="581" width="256" height="22" fill="#F4F7FA"/><text x="354" y="596" font-size="13" font-weight="400" fill="#0F2A3D">method</text><text x="588" y="596" font-size="11.5" font-weight="400" text-anchor="end" fill="#4B5563">part_number | text</text><text x="354" y="618" font-size="13" font-weight="400" fill="#0F2A3D">score</text><rect x="342" y="625" width="256" height="22" fill="#F4F7FA"/><text x="354" y="640" font-size="13" font-weight="400" fill="#0F2A3D">notified_at</text><rect x="650" y="110" width="260" height="306" rx="12" fill="#FFFFFF" stroke="#C2540A" stroke-width="2"/