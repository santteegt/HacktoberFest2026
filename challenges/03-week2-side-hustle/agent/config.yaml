# Hermes profile "rc-parts". Secrets live in the profile's .env, never here.

# One open-weight model for every turn: Gemma 4 26B A4B (MoE, 4B active) on OpenRouter.
# The ":free" id shares an upstream pool and was rate-limited during the build (2026-10-18), so the
# paid id is the default: $0.0675 / $0.225 per 1M tokens, a few cents a day for a club.
# Self-host fallback: provider "custom" pointing at Ollama with the same model family.
model:
  default: "google/gemma-4-26b-a4b-it"
  provider: "openrouter"

# The bot lives in WhatsApp. It gets the shell (for the rcparts command), skills and a clarify tool,
# nothing else: no browser, web, files, code execution, delegation or messaging tools.
platform_toolsets:
  whatsapp: ["terminal", "skills", "clarify"]
  cli: ["terminal", "skills", "clarify", "cronjob"]

# Members' stock and quotes live in Postgres on Tiger Cloud. The agent may read through Tiger MCP
# (ad-hoc "who has X" questions); every write goes through rcparts, which validates in code.
mcp_servers:
  tiger:
    command: "tiger"
    args: ["mcp", "start"]
    tools:
      include: ["db_query"]

# Voice notes in the group are transcribed with the local open Whisper (faster-whisper); Spanish and
# English are both common in the club. Switch provider to elevenlabs (ELEVENLABS_API_KEY) if needed.
stt:
  enabled: true
  provider: "local"
  local:
    model: "small"

whatsapp:
  reply_prefix: ""
  unauthorized_dm_behavior: ignore
  send_read_receipts: true

approvals:
  mode: smart

# rcparts reads its own .env from RCPARTS_HOME; the shell tool only needs to know where that is.
terminal:
  backend: local
  cwd: "${RCPARTS_HOME}"
  env_passthrough: ["RCPARTS_HOME"]

# Members only see answers: no "running skill/command" breadcrumbs, no reasoning, no mid-turn
# narration, no diagnostics in the club group or in DMs. Tool calls still go to the session log.
display:
  platforms:
    whatsapp:
      tool_progress: log
      show_reasoning: false
      interim_assistant_messages: false
      long_running_notifications: false
      busy_ack_detail: false
      suppress_warning_notifications: true
